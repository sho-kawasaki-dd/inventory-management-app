[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory-manager-mini"
version = "0.3.1"
authors = [{ name = "IKinoCore" }]
license = "MIT"
license-files = [
    "LICENSE",
    "packaging/DISTRIBUTION_LICENSE.txt",
    "packaging/THIRD_PARTY_NOTICES.txt",
    "packaging/SOURCE_CODE.txt",
    "packaging/licenses/*.txt",
]
requires-python = ">=3.13"
dependencies = [
    "PySide6",
    "platformdirs",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-cov",
    "ruff",
    "pyright",
    "pyinstaller",
    "tzdata",
    "playwright>=1.64.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_manager_mini"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests", "scripts"]
typeCheckingMode = "standard"
strict = [
    "src/inventory_manager_mini/core",
    "src/inventory_manager_mini/db",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --strict-markers --strict-config"
markers = ["perf: 時間のかかる性能計測テスト"]

[tool.coverage.run]
source = ["inventory_manager_mini"]
branch = false
